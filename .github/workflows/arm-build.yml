name: arm64 install test
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [avatar, llm, stt, tts]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true; df -h /
      - name: CUDA 12.8 toolkit (sbsa, no driver)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && sudo apt-get update -q && sudo apt-get install -y -q cuda-toolkit-12-8 cuda-toolkit-13-0
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
      - name: Install ${{ matrix.part }}
        run: sudo -E env PATH=/usr/local/cuda/bin:$PATH CUDA_HOME=/usr/local/cuda JOBS=4 bash install_${{ matrix.part }}.sh
      - name: Disk after
        if: always()
        run: df -h /
